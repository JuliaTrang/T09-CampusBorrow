<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1190" viewBox="-10 -10 1320 1190" role="img" aria-label="Selected staff journeys"><defs><marker id="arrow-SF-01-B" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker></defs><rect x="-10" y="-10" width="1320" height="1190" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="52" font-size="26" font-weight="700" text-anchor="start" fill="#111827">SF-01-B | Selected staff journeys</text><text x="50" y="89" font-size="16" font-weight="400" text-anchor="start" fill="#111827">Main UCs: UC-01, UC-11, UC-13 | S09 is selected; SD-05 / UC-19 is optional only for sequences.</text><text x="50" y="118" font-size="14" font-weight="400" text-anchor="start" fill="#111827">CampusBorrow | PA3 6.1 | Owner: Phuc | 2026-11-20 | Draft for team review</text><polyline points="650,280 650,430" fill="none" stroke="#111827" stroke-width="1.5"  marker-end="url(#arrow-SF-01-B)"/><polyline points="560,540 560,650 220,650 220,770" fill="none" stroke="#111827" stroke-width="1.5"  marker-end="url(#arrow-SF-01-B)"/><polyline points="70,825 30,825 30,485 500,485" fill="none" stroke="#111827" stroke-width="1.5"  marker-end="url(#arrow-SF-01-B)"/><polyline points="740,540 740,650 1080,650 1080,770" fill="none" stroke="#111827" stroke-width="1.5"  marker-end="url(#arrow-SF-01-B)"/><polyline points="1230,825 1270,825 1270,485 800,485" fill="none" stroke="#111827" stroke-width="1.5"  marker-end="url(#arrow-SF-01-B)"/><rect x="500" y="170" width="300" height="110" rx="8" fill="white" stroke="#475569" stroke-width="2" /><text x="650" y="198" font-size="18" font-weight="700" text-anchor="middle" fill="#475569">S01</text><text x="650" y="223" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Sign in</text><text x="650" y="247" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">All roles | staff path</text><rect x="500" y="430" width="300" height="110" rx="8" fill="white" stroke="#15803D" stroke-width="2" /><text x="650" y="453" font-size="18" font-weight="700" text-anchor="middle" fill="#15803D">S05</text><text x="650" y="478" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Equipment requests</text><text x="650" y="502" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">RM / Admin | selected screen</text><text x="650" y="524" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Approve / reject stays here</text><rect x="70" y="770" width="300" height="110" rx="8" fill="white" stroke="#15803D" stroke-width="2" /><text x="220" y="793" font-size="18" font-weight="700" text-anchor="middle" fill="#15803D">S06</text><text x="220" y="818" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Handover and returns</text><text x="220" y="842" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">RM / Admin | selected screen</text><text x="220" y="864" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Handover result shown here</text><rect x="930" y="770" width="300" height="110" rx="8" fill="white" stroke="#15803D" stroke-width="2" /><text x="1080" y="793" font-size="18" font-weight="700" text-anchor="middle" fill="#15803D">S09</text><text x="1080" y="818" font-size="16" font-weight="700" text-anchor="middle" fill="#111827">Room requests</text><text x="1080" y="842" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">RM / Admin | selected screen</text><text x="1080" y="864" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Approve / reject stays here</text><rect x="717" y="339" width="216" height="44" fill="white"/><text x="825" y="355" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">B01 Valid RM/Admin login</text><text x="825" y="377" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">(role entry: N1)</text><rect x="280.5" y="604" width="199" height="44" fill="white"/><text x="380" y="620" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">B02 Open handover view</text><text x="380" y="642" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">then select a request</text><rect x="85.5" y="559" width="199" height="44" fill="white"/><text x="185" y="575" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">B03 Equipment requests</text><text x="185" y="597" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">(menu)</text><rect x="831.75" y="604" width="156.5" height="44" fill="white"/><text x="910" y="620" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">B04 Room requests</text><text x="910" y="642" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">(menu)</text><rect x="1010.5" y="559" width="199" height="44" fill="white"/><text x="1110" y="575" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">B05 Equipment requests</text><text x="1110" y="597" font-size="16" font-weight="400" text-anchor="middle" fill="#111827">(menu)</text><text x="50" y="970" font-size="16" font-weight="400" text-anchor="start" fill="#111827">S05 / S09: rejection reason is required, 1-500 trimmed characters; invalid input stays on screen.</text><text x="50" y="998" font-size="16" font-weight="400" text-anchor="start" fill="#111827">S06: confirm physical handover only when eligible and pickup &lt;= now &lt; expiry; then show On loan.</text><text x="50" y="1026" font-size="16" font-weight="400" text-anchor="start" fill="#111827">Staff navigation connects S05, S06 and S09. Opening a view never approves or hands over an item.</text><text x="50" y="1054" font-size="16" font-weight="400" text-anchor="start" fill="#111827">The Borrower and staff journeys occur in separate authorized sessions; data availability is not navigation.</text><text x="50" y="1082" font-size="16" font-weight="400" text-anchor="start" fill="#111827">Sign out / invalid session returns to S01 (G01). UC-12 remains RM only; no new secondary flows are added.</text><text x="50" y="1110" font-size="16" font-weight="400" text-anchor="start" fill="#111827">N1/N2 are proposed navigation choices. These diagrams cover the selected Kickoff screens only.</text></g></svg>