<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 785" role="img" aria-label="S06 Handover and returns proposed screen layout"><rect x="0" y="0" width="1000" height="785" rx="5" fill="#f6f8fb" stroke="#f6f8fb"/><rect x="0" y="0" width="1000" height="60" rx="5" fill="#14293e" stroke="#14293e"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white">CampusBorrow</text><text x="650" y="36" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#d5e3ee">DESIGN PROPOSAL · S06</text><g aria-label="Staff navigation"><rect x="34" y="76" width="225" height="38" rx="5" fill="#fff" stroke="#9aa8b7"/><text x="48" y="101" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Equipment requests</text><rect x="274" y="76" width="260" height="38" rx="5" fill="#e8f1fb" stroke="#9aa8b7"/><text x="288" y="101" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172334">Handover and returns</text><rect x="550" y="76" width="205" height="38" rx="5" fill="#fff" stroke="#9aa8b7"/><text x="564" y="101" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Room requests</text><rect x="820" y="76" width="144" height="38" rx="5" fill="#fff" stroke="#9aa8b7"/><text x="834" y="101" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Sign out</text></g><text x="34" y="158" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#172334">Handover and returns</text><text x="34" y="190" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Two view variants: select a reservation for handover or a loan for return.</text><rect x="34" y="214" width="450" height="393" rx="5" fill="#fff" stroke="#9aa8b7"/><rect x="514" y="214" width="450" height="393" rx="5" fill="#fff" stroke="#9aa8b7"/><text x="54" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#15803d">Reservations</text><text x="534" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#15803d">Loans / Overdue</text><text x="54" y="282" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172334">5d8e1001… · Projector EQ-014</text><text x="534" y="282" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172334">8c2f0002… · Camera EQ-028</text><text x="54" y="312" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172334">Borrower 01 · Approved</text><text x="534" y="312" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#172334">Borrower 02 · On loan</text><text x="54" y="342" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Borrower active · Item in service</text><text x="534" y="342" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Handed over: 23 Nov 2026 08:15</text><text x="54" y="379" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Pickup: 23 Nov 2026 08:00</text><text x="54" y="407" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Collect before: 24 Nov 2026 08:00</text><text x="54" y="435" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Return deadline: 24 Nov 2026 18:00</text><text x="534" y="379" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Return deadline: 24 Nov 2026 18:00</text><text x="534" y="407" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#172334">Actual return time is recorded on confirmation.</text><rect x="54" y="470" width="225" height="42" rx="5" fill="#15803d" stroke="#15803d"/><text x="69" y="497" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Record handover</text><rect x="534" y="470" width="225" height="42" rx="5" fill="#15803d" stroke="#15803d"/><text x="549" y="497" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff">Record return</text><text x="54" y="546" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Available only inside the pickup window.</text><text x="54" y="575" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Confirm physical handover before saving.</text><text x="534" y="546" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Confirm physical receipt before saving.</text><text x="534" y="575" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Inactive borrower does not prevent a return.</text><rect x="34" y="634" width="930" height="105" rx="5" fill="#fff5e6" stroke="#c8872c"/><text x="54" y="665" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#172334">Collection window expired</text><text x="54" y="692" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Handover unavailable. The reservation is cancelled and the item is released.</text><text x="54" y="718" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">Before the pickup time: handover is unavailable, but the valid reservation remains approved.</text><text x="34" y="770" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#172334">All times UTC+7. Each action opens a confirmation; eligibility is checked again before saving.</text></svg>
