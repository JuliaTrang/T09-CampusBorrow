<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="100%" height="100%" fill="#f7f9fb"/><text font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2563eb" text-anchor="middle"><tspan x="640" y="143">CampusBorrow</tspan></text><rect x="420" y="174" width="440" height="528" rx="10" fill="#ffffff" stroke="#c9d6e6"/><text font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102238"><tspan x="448" y="235">Sign in</tspan></text><text font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#455d7b"><tspan x="448" y="265">Sign in with your username or email.</tspan></text><g aria-label="S01-01 / Username or email"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="448" y="304">Username or email</tspan></text><rect x="448" y="318" width="384" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="460" y="344">Enter username or email</tspan></text></g><g aria-label="S01-02 / Password"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="448" y="392">Password</tspan></text><rect x="448" y="406" width="384" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="460" y="432">•••••••••••••••</tspan></text></g><g aria-label="S01-03 / Sign in"><rect x="448" y="468" width="384" height="44" rx="8" fill="#2563eb" stroke="#ffffff"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="640" y="494">Sign in</tspan></text></g><g aria-label="S01-05 / Create Borrower account"><rect x="448" y="526" width="384" height="44" rx="8" fill="#ffffff" stroke="#2563eb"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle"><tspan x="640" y="552">Create Borrower account</tspan></text></g><g aria-label="S01-04 / Authentication error variant"><rect x="448" y="586" width="384" height="96" rx="8" fill="#fff1f2" stroke="#f5a6ad"/><text font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="464" y="615">Authentication error variant</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#b91c1c"><tspan x="464" y="644">Unable to sign in. Check your username or email</tspan><tspan x="464" y="662.9">and password.</tspan></text></g></svg>