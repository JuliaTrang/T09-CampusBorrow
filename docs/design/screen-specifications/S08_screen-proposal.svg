<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200"><rect width="100%" height="100%" fill="#f7f9fb"/><rect x="0" y="0" width="248" height="1200" rx="0" fill="#ffffff" stroke="#c9d6e6"/><rect x="16" y="20" width="32" height="32" rx="8" fill="#2563eb" stroke="none"/><text font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff"><tspan x="20" y="40">CB</tspan></text><text font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102238"><tspan x="58" y="45">CampusBorrow</tspan></text><text font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#455d7b"><tspan x="16" y="90">BORROWER</tspan></text><g aria-label="S08-nav / Catalogue"><rect x="16" y="100" width="216" height="40" rx="8" fill="#ffffff" stroke="none"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="28" y="124">Catalogue</tspan></text></g><g aria-label="S08-nav / Room schedule"><rect x="16" y="144" width="216" height="40" rx="8" fill="#eff6ff" stroke="none"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb"><tspan x="28" y="168">Room schedule</tspan></text></g><g aria-label="S08-nav / My requests"><rect x="16" y="188" width="216" height="40" rx="8" fill="#ffffff" stroke="none"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="28" y="212">My requests</tspan></text></g><text font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#102238"><tspan x="16" y="1149">Demo Borrower</tspan></text><text font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#455d7b"><tspan x="16" y="1172">Borrower</tspan></text><g aria-label="S01-06 / Sign out"><rect x="166" y="1142" width="66" height="34" rx="8" fill="#ffffff" stroke="#2563eb"/><text font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle"><tspan x="199" y="1161">Sign out</tspan></text></g><text font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb"><tspan x="280" y="45">BORROWER</tspan></text><text font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#102238"><tspan x="280" y="88">Request a room booking</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="280" y="119">Times shown in UTC+7</tspan></text><g aria-label="S08"><rect x="1170" y="32" width="78" height="26" rx="13" fill="#ecfdf5" stroke="none"/><text font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#007f75"><tspan x="1180" y="48">S08</tspan></text></g><rect x="280" y="148" width="566" height="754" rx="10" fill="#ffffff" stroke="#c9d6e6"/><g aria-label="S08-01 / Room"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="302" y="188">Room</tspan></text><rect x="302" y="202" width="522" height="44" rx="8" fill="#f7f9fb" stroke="#c9d6e6"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="314" y="228">R-01 · Capacity 30 · In service</tspan></text></g><g aria-label="S08-02 / Booking date *"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="302" y="282">Booking date *</tspan></text><rect x="302" y="296" width="522" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="314" y="322">25 Nov 2026</tspan></text></g><g aria-label="S08-03 / First period *"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="302" y="376">First period *</tspan></text><rect x="302" y="390" width="252" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="314" y="416">P2 · 08:15–09:00</tspan></text></g><g aria-label="S08-04 / Last period *"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="572" y="376">Last period *</tspan></text><rect x="572" y="390" width="252" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="584" y="416">P3 · 09:30–10:15</tspan></text></g><g aria-label="S08-05 / Derived reservation interval"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="302" y="470">Derived reservation interval</tspan></text><rect x="302" y="484" width="522" height="44" rx="8" fill="#f7f9fb" stroke="#c9d6e6"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="314" y="510">08:15–10:15 (120 minutes including break)</tspan></text></g><g aria-label="S08-06 / Headcount *"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="302" y="564">Headcount *</tspan></text><rect x="302" y="578" width="150" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="314" y="604">28</tspan></text></g><g aria-label="S08-07 / Purpose *"><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#102238"><tspan x="472" y="564">Purpose *</tspan></text><rect x="472" y="578" width="352" height="44" rx="8" fill="#ffffff" stroke="#7085a0"/><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="484" y="604">Student club meeting</tspan></text></g><text font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#455d7b"><tspan x="302" y="669">Choose consecutive periods within Morning or Afternoon.</tspan><tspan x="302" y="686.55">The room is held through intervening breaks.</tspan><tspan x="302" y="704.1">A successful request is Pending and does not reserve the room.</tspan></text><g aria-label="S08-08 / Submit booking"><rect x="302" y="762" width="190" height="44" rx="8" fill="#2563eb" stroke="#ffffff"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle"><tspan x="397" y="788">Submit request</tspan></text></g><g aria-label="S08-09 / Back to schedule"><rect x="510" y="762" width="220" height="44" rx="8" fill="#ffffff" stroke="#2563eb"/><text font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle"><tspan x="620" y="788">Back to schedule</tspan></text></g><text font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#455d7b"><tspan x="302" y="847">Tab order: Date → First → Last → Headcount → Purpose</tspan><tspan x="302" y="864.55">→ Submit → Back. Room and derived times are read-only.</tspan></text><rect x="870" y="148" width="378" height="340" rx="10" fill="#ffffff" stroke="#c9d6e6"/><text font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#102238"><tspan x="892" y="193">Fixed timetable</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#455d7b"><tspan x="892" y="240">MORNING</tspan><tspan x="892" y="258.9">P1 07:30–08:15 · P2 08:15–09:00</tspan><tspan x="892" y="277.8">Break 09:00–09:30</tspan><tspan x="892" y="296.7">P3 09:30–10:15 · P4 10:15–11:00</tspan><tspan x="892" y="315.6"></tspan><tspan x="892" y="334.5">AFTERNOON</tspan><tspan x="892" y="353.4">P5 13:30–14:15 · P6 14:15–15:00</tspan><tspan x="892" y="372.3">Break 15:00–15:30</tspan><tspan x="892" y="391.20000000000005">P7 15:30–16:15 · P8 16:15–17:00</tspan></text><text font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#102238"><tspan x="870" y="536">Independent validation variants</tspan></text><g aria-label="S08-10 / Schedule conflict"><rect x="870" y="568" width="378" height="120" rx="8" fill="#fff1f2" stroke="#f5a6ad"/><text font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="886" y="597">Schedule conflict</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#b91c1c"><tspan x="886" y="626">This interval is no longer available.</tspan><tspan x="886" y="644.9">Choose different periods; your input is retained.</tspan></text></g><g aria-label="S08-10 / Capacity exceeded"><rect x="870" y="708" width="378" height="112" rx="8" fill="#fff1f2" stroke="#f5a6ad"/><text font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="886" y="737">Capacity exceeded</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#b91c1c"><tspan x="886" y="766">31 attendees exceeds capacity 30.</tspan><tspan x="886" y="784.9">Reduce the headcount to submit.</tspan></text></g><g aria-label="S08-10 / Cross-session selection"><rect x="870" y="840" width="378" height="112" rx="8" fill="#fff1f2" stroke="#f5a6ad"/><text font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="886" y="869">Cross-session selection</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#b91c1c"><tspan x="886" y="898">P4–P5 spans Morning and Afternoon.</tspan><tspan x="886" y="916.9">Submit two separate requests.</tspan></text></g><g aria-label="S08-10 / Break-only selection invalid"><rect x="870" y="972" width="378" height="112" rx="8" fill="#fff1f2" stroke="#f5a6ad"/><text font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c"><tspan x="886" y="1001">Break-only selection invalid</tspan></text><text font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#b91c1c"><tspan x="886" y="1030">Breaks are not selectable periods.</tspan><tspan x="886" y="1048.9">Select one or more teaching periods.</tspan></text></g></svg>