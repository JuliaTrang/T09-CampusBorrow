"16" font-weight="400" fill="#111827">Actor must be an active Admin</text></g><g><rect x="580" y="760" width="390" height="210" fill="white" stroke="#111827" stroke-width="1.5"/><line x1="580" y1="800" x2="970" y2="800" stroke="#111827" stroke-width="1.5"/><text x="775" y="787" text-anchor="middle" font-size="18" font-weight="700">StateCorrection «Should»</text><text x="593" y="826" font-size="16" font-weight="400" fill="#111827">operation_code : CorrectionOperation</text><text x="593" y="851" font-size="16" font-weight="400" fill="#111827">before, after</text><text x="593" y="876" font-size="16" font-weight="400" fill="#111827">reason</text><text x="593" y="901" font-size="16" font-weight="400" fill="#111827">applied_at</text></g><text x="374" y="194" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="530" y="194" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="425" y="238" font-size="16" font-weight="400" fill="#111827">actor</text><text x="374" y="270" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="530" y="369" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="465" y="328" font-size="14" font-weight="400" fill="#111827">target: ACCOUNT</text><text x="374" y="544" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="530" y="414" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="390" y="590" font-size="14" font-weight="400" fill="#111827">target: RESOURCE</text><text x="982" y="203" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="1082" y="203" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="984" y="249" font-size="14" font-weight="400" fill="#111827">target: request</text><text x="984" y="383" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="1083" y="544" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="1040" y="483" font-size="14" font-weight="400" fill="#111827">target: booking</text><text x="375" y="834" font-size="16" font-weight="400" fill="#111827">1</text><text x="530" y="834" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="409" y="880" font-size="16" font-weight="400" fill="#111827">performed by</text><text x="792" y="740" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="792" y="478" font-size="16" font-weight="400" fill="#111827">1</text><text x="797" y="620" font-size="16" font-weight="400" fill="#111827">records primary</text><text x="797" y="645" font-size="15" font-weight="400" fill="#111827">STATE_CORRECTED</text><text x="983" y="882" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="1300" y="654" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="1050" y="929" font-size="15" font-weight="400" fill="#111827">corrected booking (CO-04)</text><text x="865" y="995" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="1300" y="315" font-size="16" font-weight="400" fill="#111827">0..1</text><text x="1005" y="1043" font-size="15" font-weight="400" fill="#111827">corrected request (CO-01 / CO-02 / CO-03)</text><text x="40" y="36" font-size="27" font-weight="700" fill="#111827">DM-01 · Domain Model — History and corrections</text><text x="40" y="73" font-size="16" font-weight="400" fill="#111827">View B of 2 · Append-only evidence and guarded administrative corrections</text><text x="40" y="101" font-size="15" font-weight="400" fill="#475569">PA3 §4.1 • CampusBorrow • Owner: Phuc • Last modified: 2026-11-18</text><text x="55" y="1120" font-size="15" font-weight="700" fill="#111827">CONSTRAINTS</text><text x="55" y="1146" font-size="16" font-weight="400" fill="#111827">Each HistoryEvent has exactly ONE target across its four target associations. An absent actor means SYSTEM.</text><text x="55" y="1172" font-size="16" font-weight="400" fill="#111827">Each StateCorrection targets exactly ONE EquipmentRequest OR RoomBooking and records one primary correction event.</text><text x="55" y="1198" font-size="16" font-weight="400" fill="#111827">HistoryEvent and StateCorrection records are retained. Corrections append evidence; they do not overwrite earlier events.</text><text x="55" y="1224" font-size="16" font-weight="400" fill="#111827">«Should» is the agreed feature priority. Its authorization, reason and consistency guards remain mandatory when delivered.</text><text x="55" y="1250" font-size="16" font-weight="400" fill="#111827">Shaded classes repeat View A. Account is also repeated here to keep the Admin association readable.</text></g></svg>