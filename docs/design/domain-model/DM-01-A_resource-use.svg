1" font-size="16" font-weight="400" fill="#111827">return_due_at</text><text x="83" y="836" font-size="16" font-weight="400" fill="#111827">status : EquipmentRequestStatus</text><text x="83" y="861" font-size="16" font-weight="400" fill="#111827">decided_at, decision_reason [0..1]</text><text x="83" y="886" font-size="16" font-weight="400" fill="#111827">handed_over_at, returned_at [0..1]</text><text x="83" y="911" font-size="16" font-weight="400" fill="#111827">cancellation_cause, cancellation_reason [0..1]</text><text x="83" y="936" font-size="16" font-weight="400" fill="#111827">/expiry_at [0..1]</text><text x="83" y="961" font-size="16" font-weight="400" fill="#111827">/overdue : Boolean</text></g><g><rect x="1000" y="670" width="430" height="229" fill="white" stroke="#111827" stroke-width="1.5"/><line x1="1000" y1="710" x2="1430" y2="710" stroke="#111827" stroke-width="1.5"/><text x="1215" y="697" text-anchor="middle" font-size="18" font-weight="700">RoomBooking</text><text x="1013" y="736" font-size="16" font-weight="400" fill="#111827">booking_date</text><text x="1013" y="761" font-size="16" font-weight="400" fill="#111827">headcount : positive integer</text><text x="1013" y="786" font-size="16" font-weight="400" fill="#111827">purpose</text><text x="1013" y="811" font-size="16" font-weight="400" fill="#111827">status : RoomBookingStatus</text><text x="1013" y="836" font-size="16" font-weight="400" fill="#111827">decided_at, decision_reason [0..1]</text><text x="1013" y="861" font-size="16" font-weight="400" fill="#111827">cancellation_reason [0..1]</text><text x="1013" y="886" font-size="16" font-weight="400" fill="#111827">/start_at, /end_at</text></g><g><rect x="600" y="935" width="280" height="154" fill="white" stroke="#111827" stroke-width="1.5"/><line x1="600" y1="975" x2="880" y2="975" stroke="#111827" stroke-width="1.5"/><text x="740" y="962" text-anchor="middle" font-size="18" font-weight="700">Period</text><text x="613" y="1001" font-size="16" font-weight="400" fill="#111827">code : P1–P8</text><text x="613" y="1026" font-size="16" font-weight="400" fill="#111827">session : DaySession</text><text x="613" y="1051" font-size="16" font-weight="400" fill="#111827">start_time, end_time</text><text x="613" y="1076" font-size="16" font-weight="400" fill="#111827">seq</text></g><text x="270" y="511" font-size="16" font-weight="400" fill="#111827">1</text><text x="270" y="650" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="270" y="568" font-size="16" font-weight="400" fill="#111827">requested item</text><text x="1260" y="511" font-size="16" font-weight="400" fill="#111827">1</text><text x="1260" y="650" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="1260" y="568" font-size="16" font-weight="400" fill="#111827">booked room</text><text x="568" y="491" font-size="16" font-weight="400" fill="#111827">1</text><text x="444" y="651" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="380" y="603" font-size="16" font-weight="400" fill="#111827">submits (borrower)</text><text x="917" y="491" font-size="16" font-weight="400" fill="#111827">1</text><text x="1080" y="651" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="965" y="603" font-size="16" font-weight="400" fill="#111827">submits (borrower)</text><text x="948" y="814" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="892" y="955" font-size="16" font-weight="400" fill="#111827">1</text><text x="835" y="805" font-size="16" font-weight="400" fill="#111827">first_period</text><text x="1065" y="929" font-size="16" font-weight="400" fill="#111827">0..*</text><text x="892" y="1024" font-size="16" font-weight="400" fill="#111827">1</text><text x="950" y="1075" font-size="16" font-weight="400" fill="#111827">last_period</text><text x="40" y="36" font-size="27" font-weight="700" fill="#111827">DM-01 · Domain Model — Resource use</text><text x="40" y="73" font-size="16" font-weight="400" fill="#111827">View A of 2 · Conceptual classes, attributes and associations</text><text x="40" y="101" font-size="15" font-weight="400" fill="#475569">PA3 §4.1 • CampusBorrow • Owner: Phuc • Last modified: 2026-11-18</text><text x="660" y="367" font-size="16" font-weight="400" fill="#111827">{complete, disjoint}</text><text x="70" y="1151" font-size="15" font-weight="700" fill="#111827">READING THE MODEL</text><text x="70" y="1178" font-size="16" font-weight="400" fill="#111827">1 / 0..1 / 0..* = exactly one / optional one / any number. Hollow triangle points to the general class.</text><text x="70" y="1204" font-size="16" font-weight="400" fill="#111827">/ marks a derived value. [0..1] marks an optional attribute; lifecycle rules may require it. No operations are shown.</text><text x="70" y="1230" font-size="16" font-weight="400" fill="#111827">History and corrections appear in View B. Repeated class names refer to the same concepts, not additional classes.</text></g></svg>